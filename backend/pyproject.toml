[project]
name = "oddjob-backend"
version = "0.1.0"
description = "Oddjob — engagement data store API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.118",
    "uvicorn[standard]>=0.37",
    # [asyncio] pulls greenlet, which SQLAlchemy's async layer refuses to
    # import without. Plain "sqlalchemy" installs and then fails at runtime.
    "sqlalchemy[asyncio]>=2.0.43",
    "aiosqlite>=0.21",
    "pydantic>=2.11",
    "argon2-cffi>=25.1.0",
    "pyjwt>=2.15.1",
    "mcp[cli]>=2.3.0",
    "httpx>=0.28.1",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.6",
    "alembic>=1.20.0",
    "reportlab>=5.0.1",
    "python-docx>=1.2.0",
    "defusedxml>=0.7.1",
    # Ed25519 for agent identities. Was already present transitively;
    # depending on it directly means an upstream dropping it does not
    # silently take agent authentication with it.
    "cryptography>=43",
]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
