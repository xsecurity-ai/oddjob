# golangci-lint configuration for the Ghost agent.
#
# The set below is deliberately small. Ghost runs unattended inside a
# client's network for the length of an engagement, on a host nobody
# will log back into — so the linters that earn their place are the ones
# that catch things which fail silently in that setting: an error that
# was never read, a response body that was never closed, a nil check
# that cannot fire. Style linters are left off. A rule that fires three
# hundred times teaches people to run `golangci-lint` with `--fix` and
# stop reading the output, which costs more than it buys.
#
# `gosimple` is not listed because it no longer exists as a separate
# linter: golangci-lint v2 folded it, and `stylecheck`, into
# `staticcheck`. Enabling it here is a hard config error, not a no-op.
version: "2"

linters:
  # Start from nothing and name every linter, so the set does not change
  # underneath us when golangci-lint changes its own defaults.
  default: none
  enable:
    # --- the default five, all of which pay for themselves ---
    - errcheck      # an unchecked error is the usual shape of a silent failure
    - govet         # same passes as `go vet`, which CI already gates on
    - ineffassign   # a value computed and then thrown away is usually a typo
    - staticcheck   # correctness + simplification + style (ex-gosimple/stylecheck)
    - unused        # dead code in an agent is code nobody has tested in months

    # --- added ---
    # This is security tooling that runs with raw sockets, shells out to
    # scanners, and writes a client's findings to disk. gosec is the
    # linter most worth arguing with, one finding at a time.
    - gosec
    # Ghost makes HTTP requests to its own server and to a public-IP
    # service. A leaked response body on a long-lived agent is a file
    # descriptor and a connection that never come back.
    - bodyclose
    # Every outbound request must be cancellable: the loop has to be
    # able to shut down, and a context-less call on a stranded host
    # hangs until the TCP stack gives up.
    - noctx
    # `err == x` instead of `errors.Is(err, x)` silently stops matching
    # the moment anything in the chain wraps. Ghost wraps heavily.
    - errorlint
    # A function that returns nil after finding a non-nil error is a
    # real bug class and reads as correct.
    - nilerr
    # Comments are load-bearing in this codebase and get read by
    # operators. Typos in them are cheap to fix.
    - misspell
    # Keeps the //nolint directives in this tree honest: each must name
    # the linter it suppresses and carry an explanation, and one that
    # has stopped suppressing anything is flagged rather than left to
    # rot.
    - nolintlint
    # go1.22 changed loop variable semantics; the old `x := x` shim is
    # now noise, and spotting it keeps the goroutine-capture reviews
    # focused on the captures that still matter.
    - copyloopvar
    # A conversion that does nothing usually means the types moved and
    # the conversion did not.
    - unconvert

  settings:
    errcheck:
      # A type assertion without the `, ok` form panics on the value it
      # did not expect, and this agent decodes task arguments that came
      # off the wire.
      check-type-assertions: true
      # check-blank stays off. `_ = resp.Body.Close()` is this
      # codebase's way of writing "this error was considered and there
      # is nothing to do with it", and it is the better convention:
      # turning it on makes the deliberate discard indistinguishable
      # from the forgotten one, which is exactly the signal errcheck
      # exists to preserve. The forgotten ones — a bare call with the
      # error dropped on the floor — are still caught.
      check-blank: false

    govet:
      enable-all: true
      disable:
        # fieldalignment reorders struct fields for padding. The structs
        # here are grouped by meaning and commented accordingly; saving
        # eight bytes per agent is not worth scrambling that.
        - fieldalignment
        # shadow fires on `if err := f(); err != nil` inside a function
        # that already has an `err` — the single most common correct
        # pattern in Go, and the reason the Go team ships this pass
        # switched off in `go vet` too. Every hit in this tree was that
        # pattern handling its own error two lines later.
        - shadow

    # gosec is deliberately left at its defaults. Its file-permission
    # thresholds (G301 0750, G302/G306 0600) are already what this
    # agent writes — 0o700 directories, 0o600 files — so pinning them
    # here would only restate the default and then rot when the default
    # tightens.

    nolintlint:
      require-explanation: true
      require-specific: true
      allow-unused: false

    staticcheck:
      # Everything, less one check. In particular the ST (style) and SA
      # (correctness) families are both on: ST1020/ST1021 are what
      # caught the four doc comments that had drifted onto the wrong
      # declaration, which is the kind of thing only a linter finds.
      checks:
        - all
        # QF1001: De Morgan's law. A "quickfix" suggestion with no
        # correctness content, and here it is a downgrade: the one hit
        # is a character-class test, where `!(c >= 'a' && c <= 'z')`
        # says "not a lowercase letter" and the rewritten
        # `(c < 'a' || c > 'z')` says it in a form the reader has to
        # re-derive. ST and SA checks stay on.
        - -QF1001

  exclusions:
    generated: lax
    # No `common-false-positives` preset. It is tempting and it is
    # wrong here: switching it on silently drops four gosec findings,
    # one of which is the exec in tasks.runCmd — the single place where
    # arguments that came from the server reach a privileged
    # subprocess. In security tooling that is the finding you most want
    # a human to have read. Each of the four is suppressed at its own
    # line instead, with the reason it is safe written next to it.
    rules:
      # httptest.NewRequest builds a request value for a handler to be
      # called with directly. It is never sent, so there is no call for
      # a context to cancel and noctx's advice does not apply. Scoped
      # to noctx alone and to tests alone: gosec is deliberately NOT
      # excluded here, because a test that writes a key to a
      # world-readable path is still a key on a world-readable path.
      - path: _test\.go
        linters:
          - noctx

formatters:
  enable:
    - gofmt
