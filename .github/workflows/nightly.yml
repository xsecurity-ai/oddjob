# Nightly images for oddjob and drone, built only when their own
# source has changed.
#
# `paths:` cannot do this. Path filters are ignored on a `schedule`
# trigger, so a nightly either rebuilds every night regardless — which
# republishes a byte-identical image and makes "when did this change?"
# unanswerable — or it does not run at all.
#
# So each image is keyed on a hash of ITS OWN inputs, and the build is
# skipped when an image already exists for that key. That is stricter
# than "did any commit land": a change to the README, or to the other
# image's source, correctly rebuilds nothing.
#
# The two are not symmetric, and this is the part worth reading:
#
#   drone  <- drone/
#   oddjob <- backend/ frontend/ docker/ Dockerfile AND drone/
#
# because the oddjob image compiles the drone binaries into itself for
# the download endpoint. A drone-only change therefore rebuilds both,
# which is correct and is exactly the thing a naive `paths: drone/**`
# filter on the oddjob job would get wrong.
name: nightly

on:
  push:
    branches: [main]
    # Deliberately no `paths:` filter. The content key below already
    # decides, and a second mechanism that can disagree with it is how
    # you get a push that skips a build the key says is needed — after
    # a revert, for instance, where the paths changed but the tree
    # went back to one already built.
  schedule:
    # 03:17 UTC. Not on the hour: GitHub queues scheduled runs hard at
    # :00 and a nightly that waits twenty minutes for a runner is a
    # nightly that sometimes does not happen.
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if nothing changed'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      drone_key: ${{ steps.k.outputs.drone_key }}
      oddjob_key: ${{ steps.k.outputs.oddjob_key }}
      drone_needed: ${{ steps.k.outputs.drone_needed }}
      oddjob_needed: ${{ steps.k.outputs.oddjob_needed }}
      date: ${{ steps.k.outputs.date }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Work out what changed
        id: k
        env:
          FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          # `git rev-parse HEAD:<path>` is the tree hash: it changes
          # when the contents change and not otherwise. Commit SHAs
          # would rebuild on every merge, which is the thing being
          # avoided.
          drone_tree=$(git rev-parse "HEAD:drone")
          odd_tree=$(
            { git rev-parse "HEAD:backend" "HEAD:frontend" "HEAD:docker" "HEAD:drone"
              git rev-parse "HEAD:Dockerfile"
            } | sha256sum | cut -c1-16)
          drone_key="${drone_tree:0:16}"
          {
            echo "drone_key=$drone_key"
            echo "oddjob_key=$odd_tree"
            echo "date=$(date -u +%Y%m%d)"
          } >> "$GITHUB_OUTPUT"

          # Does an image already exist for that exact source? If so
          # the night's work is a no-op. `docker manifest inspect`
          # needs no login for a public repo and no pull.
          need() {
            if [ "$FORCE" = "true" ]; then echo true; return; fi
            if docker manifest inspect "docker.io/cr0n1c/$1:src-$2" >/dev/null 2>&1
            then echo false; else echo true; fi
          }
          echo "drone_needed=$(need drone "$drone_key")"   >> "$GITHUB_OUTPUT"
          echo "oddjob_needed=$(need oddjob "$odd_tree")"  >> "$GITHUB_OUTPUT"

      - name: Say what will happen
        run: |
          {
            echo "### Nightly plan"
            echo "| image | source key | build |"
            echo "|---|---|---|"
            echo "| drone | \`${{ steps.k.outputs.drone_key }}\` | ${{ steps.k.outputs.drone_needed }} |"
            echo "| oddjob | \`${{ steps.k.outputs.oddjob_key }}\` | ${{ steps.k.outputs.oddjob_needed }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  drone:
    needs: plan
    if: needs.plan.outputs.drone_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: ./drone
          platforms: linux/amd64,linux/arm64
          push: true
          # `src-<key>` is the durable one: it is what the next
          # night checks for, and what a promotion resolves through.
          # `nightly` is a moving pointer for convenience.
          tags: |
            cr0n1c/drone:src-${{ needs.plan.outputs.drone_key }}
            cr0n1c/drone:nightly
            cr0n1c/drone:nightly-${{ needs.plan.outputs.date }}
          cache-from: type=gha,scope=drone
          cache-to: type=gha,scope=drone,mode=max

  oddjob:
    needs: plan
    if: needs.plan.outputs.oddjob_needed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            cr0n1c/oddjob:src-${{ needs.plan.outputs.oddjob_key }}
            cr0n1c/oddjob:nightly
            cr0n1c/oddjob:nightly-${{ needs.plan.outputs.date }}
          cache-from: type=gha,scope=oddjob
          cache-to: type=gha,scope=oddjob,mode=max
