name: CI

# Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
# controls the action's repository can repoint v4 at new code, and that
# code then runs in CI with this repository checked out. The trailing
# comment is the tag the SHA came from, so Dependabot can still offer an
# upgrade and a human can still read it.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A new push to a branch makes the previous run pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The backend serves the built UI, and the suite checks that it
      # does — the sign-in page, the SPA routes and the favicons are all
      # read off disk. Without a build those are 404s, which is a
      # missing artifact, not a broken app.
      - name: Build the UI
        working-directory: frontend
        run: npm ci && npm run build

      - name: Install
        working-directory: backend
        run: uv sync --locked

      # Each suite builds its own SQLite database from the migrations and
      # runs against its own server on its own port, so this needs no
      # services and no fixtures.
      - name: Tests
        working-directory: backend
        run: uv run python runtests.py

  migrations:
    name: migrations build the models
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --locked

      # If the migrations and the models disagree, every other test is
      # passing against a schema no deployment will ever have.
      - name: Upgrade, then check for undeclared drift
        working-directory: backend
        env:
          ODDJOB_DB: /tmp/ci-migrations.db
        run: |
          uv run alembic upgrade head
          uv run alembic check

      - name: Downgrade to base and back
        working-directory: backend
        env:
          ODDJOB_DB: /tmp/ci-downgrade.db
        run: |
          uv run alembic upgrade head
          uv run alembic downgrade base
          uv run alembic upgrade head

  postgres:
    name: backend tests on postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        # The same image and digest the compose file deploys, so this
        # job tests the major version that actually ships. It was left
        # on postgres:17 when the db service moved to 18, which made
        # the one job whose whole purpose is catching Postgres-specific
        # behaviour the one job testing the wrong Postgres.
        image: cgr.dev/chainguard/postgres:latest@sha256:0c4eaf6cb9bd65337d834f5ebfe79add4312ee2125ab584bf1fbc071abc6bb8f
        env:
          POSTGRES_USER: oddjob
          POSTGRES_PASSWORD: oddjob
          POSTGRES_DB: oddjob
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U oddjob"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --locked

      # SQLite forgives things Postgres does not — it ignores VARCHAR
      # lengths and stores NUL bytes in text — so a suite that only ever
      # runs on SQLite passes right up until the first real deployment.
      # One database per suite. Every suite starts by creating the admin
      # through /api/auth/setup, which refuses once a user exists — so
      # sharing a database means the second suite dies on its first line.
      - name: Run the suites against Postgres
        working-directory: backend
        run: |
          set -euo pipefail
          port=8099
          for suite in importtest webtest projecttest; do
            db="ci_$suite"
            PGPASSWORD=oddjob psql -h 127.0.0.1 -U oddjob -d postgres \
              -c "DROP DATABASE IF EXISTS $db" -c "CREATE DATABASE $db"
            export ODDJOB_DATABASE_URL="postgresql://oddjob:oddjob@127.0.0.1:5432/$db"
            uv run alembic upgrade head
            uv run alembic check
            uv run uvicorn app.main:app --host 127.0.0.1 --port $port &
            srv=$!
            for i in $(seq 1 40); do
              curl -sf "http://127.0.0.1:$port/api/auth/setup-required" >/dev/null && break
              sleep 1
            done
            ODDJOB_TEST_BASE="http://127.0.0.1:$port" uv run python "tests/$suite.py"
            kill $srv 2>/dev/null || true
            wait $srv 2>/dev/null || true
            port=$((port + 1))
          done

  frontend:
    name: frontend typecheck and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      # React re-runs hooks in the order they were called. A hook after
      # an early return changes that order between renders and blanks
      # the page at runtime, which a typecheck cannot see.
      - name: Hooks order
        working-directory: frontend
        run: node test/hooks.check.mjs

      - name: Logic tests
        working-directory: frontend
        run: npm run test:logic --if-present

      - name: Build
        working-directory: frontend
        run: npm run build

  drone:
    name: drone builds for every target
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: drone/go.sum

      # The release version, from the one file that decides it. Used
      # both as the agent image's build argument and as the value the
      # built binaries are checked against.
      - name: The version
        id: ver
        run: echo "version=$(scripts/version.sh --release)" >> "$GITHUB_OUTPUT"

      - name: Formatted
        working-directory: drone
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        working-directory: drone
        run: go vet ./...

      - name: Tests
        working-directory: drone
        run: go test -race ./...

      # The agent is only useful if it reaches the host it is needed
      # on, and that host is whatever the client has. A target that
      # stops compiling is found here rather than at the point someone
      # needs a Windows binary.
      - name: Cross-compile every release target
        working-directory: drone
        # ODDJOB_RELEASE=1 so these are built the way a release is
        # built — bare version, no `-dev-` suffix. The step below
        # proves it, and the one after that proves the suffix still
        # appears when nobody asks for a release, so neither direction
        # of the mechanism can rot unnoticed.
        env:
          ODDJOB_RELEASE: '1'
        run: make release

      # Layer cache for the image build below. Without it every PR
      # recompiles amass, nuclei, httpx and gospider from source —
      # four large Go programs, and the bulk of this job's four
      # minutes.
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      # Through the action rather than `docker buildx build`, because
      # `type=gha` needs ACTIONS_RUNTIME_TOKEN and GitHub exposes that
      # to actions and not to `run:` steps. The CLI form builds fine
      # and then caches nothing, which is the failure that looks like
      # success.
      - name: Build the agent image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: ./drone
          load: true
          tags: drone-agent
          # The same build argument images.yml passes, from the same
          # script and the same file. The agent image's context is
          # `drone/`, which has no VERSION in it — see the comment
          # above the ARG in drone/Dockerfile.
          build-args: |
            DRONE_VERSION=${{ steps.ver.outputs.version }}
          cache-from: type=gha,scope=ci-drone
          cache-to: type=gha,scope=ci-drone,mode=max

      # The agent image is how most people will actually deploy this,
      # and it has already hidden one bug the binaries could not: file
      # capabilities that are present and not effective.
      - name: The agent image can raw-socket
        working-directory: drone
        run: |
          docker run --rm --cap-drop=ALL --cap-add=NET_RAW --cap-add=NET_ADMIN \
            drone-agent check > /tmp/check.json || true
          cat /tmp/check.json
          python3 - <<'EOF'
          import json
          d = json.load(open("/tmp/check.json"))
          missing = d.get("missing_baseline") or []
          assert not missing, f"baseline tools missing from the image: {missing}"
          assert d["privileged"], (
              "the image reports no raw sockets with NET_RAW granted — "
              "masscan would refuse and nmap would silently connect-scan")
          EOF

      - name: The binaries are static
        working-directory: drone
        run: |
          # A dynamically linked agent fails on the older glibc it will
          # meet in the field, which is exactly where it cannot be
          # debugged.
          if file dist/drone-linux-amd64 | grep -q 'dynamically linked'; then
            file dist/drone-linux-amd64; exit 1
          fi
          ./dist/drone-linux-amd64 version

      # The version a drone reports is the one an operator uses to
      # answer "which agent produced this scan", so it is checked out
      # of the artefact rather than trusted from the Makefile.
      #
      # `drone version` prints "drone <ver> (os/arch, goVER)". The
      # second field is the version; cut it out rather than regex the
      # line, so a change to the surrounding text fails loudly here
      # instead of quietly matching nothing.
      - name: The release binaries carry a release version
        working-directory: drone
        env:
          WANT: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          got=$(./dist/drone-linux-amd64 version | awk '{print $2}')
          ../scripts/check-version.sh "$got"
          if [ "$got" != "$WANT" ]; then
            echo "::error::the binary says $got and VERSION says $WANT." >&2
            exit 1
          fi

      # And the image, which is what most deployments actually run.
      # Built with the same argument, checked the same way: an image
      # that reports a dev version must never be publishable, and
      # images.yml and this job build it identically.
      - name: The agent image carries a release version
        env:
          WANT: ${{ steps.ver.outputs.version }}
        run: |
          set -euo pipefail
          got=$(docker run --rm --entrypoint /usr/local/bin/drone \
                  drone-agent version | awk '{print $2}')
          scripts/check-version.sh "$got"
          if [ "$got" != "$WANT" ]; then
            echo "::error::the image says $got and VERSION says $WANT." >&2
            exit 1
          fi

      # The other direction, and it is not symmetry for its own sake.
      # Every check above would still pass if the dev suffix had simply
      # stopped being produced — and then a developer's build would
      # wear a release number, which is the failure the whole
      # arrangement exists to prevent. A guard that cannot fail is not
      # a guard.
      - name: A plain build is still marked as a dev build
        working-directory: drone
        run: |
          set -euo pipefail
          make build
          got=$(./drone version | awk '{print $2}')
          echo "unreleased build reports $got"
          case "$got" in
            *-dev-*) ;;
            *) echo "::error::a build with no ODDJOB_RELEASE reported '$got'," >&2
               echo "::error::which carries no -dev- marker. The suffix has" >&2
               echo "::error::stopped working and nothing downstream would" >&2
               echo "::error::notice a dev build wearing a release number." >&2
               exit 1 ;;
          esac
          rm -f drone

  docker:
    name: image builds and the stack comes up
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3

      # Built separately from `compose up` so it can use the layer
      # cache: `compose up --build` drives the legacy builder, which
      # has none. Compose then finds the tag already present and
      # starts it rather than building again.
      #
      # Single-arch on purpose. This job asks "does it start", and the
      # arm64 answer is the same one — the multi-arch build belongs in
      # images.yml, where it is published.
      - name: Build the image
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75 # v6
        with:
          context: .
          load: true
          tags: oddjob-ci:latest
          cache-from: type=gha,scope=ci-oddjob
          cache-to: type=gha,scope=ci-oddjob,mode=max

      # Building is not the claim worth testing — starting is. The
      # interesting failures are the entrypoint, the migrations against
      # a real database, and whether the API actually serves the built
      # UI out of the image.
      - name: Bring the stack up
        env:
          ODDJOB_IMAGE: oddjob-ci:latest
        run: |
          set -euo pipefail
          printf 'POSTGRES_PASSWORD=ci-not-a-real-secret\nAPP_PORT=8000\n' > .env
          docker compose up -d
          for i in $(seq 1 60); do
            state=$(docker inspect --format '{{.State.Health.Status}}' oddjob-app-1 2>/dev/null || echo starting)
            [ "$state" = "healthy" ] && break
            [ "$i" = "60" ] && { docker compose logs; exit 1; }
            sleep 5
          done

      - name: It serves the API and the built UI
        run: |
          set -euo pipefail
          curl -fsS http://127.0.0.1:8000/api/auth/setup-required | grep -q setup_required
          curl -fsS -H 'Accept: text/html' http://127.0.0.1:8000/ | grep -qE 'assets/index-[^"]+\.js'
          curl -fsS -o /dev/null http://127.0.0.1:8000/favicon.ico

      # The one check that actually proves a `-dev-` version cannot
      # reach main: it asks the built image what version it is, rather
      # than asking the repository what it ought to be.
      #
      # The image gets its answer from app/version.py, which appends
      # the dev suffix whenever a `.git` directory sits beside VERSION.
      # `.git` is in .dockerignore, so a correctly built image cannot
      # report one — and if that ever stops being true, this fails on
      # the PR that broke it rather than on the first promotion after.
      #
      # Asked of python for the same reason as the uid check below:
      # the runtime image is distroless and there is no shell in it.
      - name: The image reports a release version
        run: |
          set -euo pipefail
          got=$(docker compose exec -T app /opt/venv/bin/python \
                  -c 'from app.version import VERSION; print(VERSION)' | tr -d '\r')
          scripts/check-version.sh "$got"
          want=$(scripts/version.sh --release)
          if [ "$got" != "$want" ]; then
            echo "::error::the image says $got and VERSION says $want." >&2
            exit 1
          fi

      - name: Migrations ran, and against Postgres
        run: |
          set -euo pipefail
          docker compose exec -T app alembic current | grep -q '(head)'
          docker compose logs app | grep -q 'db: postgresql'

      # Asked of python, not of `id`. The runtime image is distroless:
      # no shell and no coreutils, so `id -u` is not in it to run.
      # That is the point of the image rather than a limitation of it,
      # but it does mean this check has to go through the one
      # interpreter that is present.
      - name: It does not run as root
        run: |
          uid=$(docker compose exec -T app /opt/venv/bin/python -c 'import os;print(os.getuid())' | tr -d '\r')
          echo "running as uid $uid"
          test "$uid" != "0"

      - name: Tear down
        if: always()
        run: docker compose down -v

  version:
    name: the version is a releasable one
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The dev suffix is the commit timestamp, so the check needs
          # a commit to read. A shallow checkout has one; this is here
          # to say the dependency is deliberate.
          fetch-depth: 1

      # `VERSION` is a bare semver triple, the release path produces
      # no `-dev-` suffix, and the default path still produces one.
      #
      # The test lives in scripts/check-version.sh because the
      # pre-commit hook, bump-version.yml, images.yml and promote.yml
      # all run the same one. Two copies would eventually disagree,
      # and the one that matters is whichever is weaker.
      #
      # This job checks the FILE and the SCRIPT. The checks that a
      # built artefact carries a release version live in the `drone`
      # and `docker` jobs, where the artefacts are — a clean file and
      # an image built without --release is the interesting failure,
      # and nothing here could see it.
      - name: Version
        run: scripts/check-version.sh

  secrets:
    name: no secrets or client data
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # This repository is public and the application it builds handles
      # client engagement data. A credential or a client hostname landing
      # here is a disclosure, so it fails the build rather than waiting
      # to be noticed in review.
      #
      # The test itself lives in scripts/check-secrets.sh, because the
      # pre-commit hook runs the same one. Two copies would eventually
      # disagree, and the one that matters is whichever is weaker.
      - name: Scan for credentials and committed databases
        run: scripts/check-secrets.sh

      # A different job from the check above, not a replacement for it.
      # TruffleHog verifies a candidate against the provider, so it
      # finds live keys in shapes nobody here thought to write down.
      # The check above finds the shapes that matter to this repository
      # even when the key is already revoked — which is most of them by
      # the time anyone looks. Neither subsumes the other.
      #
      # `--only-verified`: without it every high-entropy string is a
      # finding, and on a repository full of example tokens and test
      # fixtures that is all noise. A scanner people learn to ignore is
      # worse than no scanner.
      #
      # Scans the full history, which is why the checkout above is
      # fetch-depth: 0 — a key removed in the next commit is still
      # disclosed, and that is the case worth catching.
      - name: TruffleHog
        uses: trufflesecurity/trufflehog@b2b0a92070f206ab7b5a1105d82a7f2f48d92341 # v3.99.0
        with:
          path: ./
          extra_args: --only-verified

  # ---------------------------------------------------------------- linters
  # Separate jobs rather than steps bolted onto the suites above, so a
  # style finding reads as a style finding and does not sit under a
  # heading that says "tests". They also run in parallel with them,
  # which the long ones do not leave room for otherwise.

  python-lint:
    name: python lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install
        working-directory: backend
        run: uv sync --locked

      # Out of uv.lock rather than astral-sh/ruff-action: the action
      # installs its own ruff, so CI and a developer's checkout could
      # drift to different versions and disagree about a clean tree.
      # This pins the linter in the same file as everything else and
      # needs no fourth third-party action to vouch for.
      #
      # Lint only. `ruff format` would rewrite 103 of 105 files — see
      # the comment above [tool.ruff] in backend/pyproject.toml.
      - name: Ruff
        working-directory: backend
        run: uv run ruff check --output-format github .

  go-lint:
    name: go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # golangci-lint only analyses the host GOOS, so a linux-only run
    # never opens mem_darwin.go, priv_windows.go or priv_notlinux.go —
    # the same blind spot the `drone` job's cross-compile step exists
    # to close.
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          cache-dependency-path: drone/go.sum

      # The linter version is pinned as well as the action: a new
      # golangci-lint release adds checks, and an unpinned one turns a
      # green PR red for a reason nobody in that PR introduced.
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        env:
          GOOS: ${{ matrix.goos }}
        with:
          version: v2.14.0
          working-directory: drone

  frontend-lint:
    name: frontend lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      # ESLint parses the TypeScript through Babel, not through the
      # compiler: typescript-eslint cannot load against TypeScript 7.
      # See the header of frontend/eslint.config.js.
      - name: Lint
        working-directory: frontend
        run: npm run lint

  dockerfile-lint:
    name: dockerfile lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # One step per file. The action's `recursive` mode globs
      # **/Dockerfile instead, which would quietly widen to whatever a
      # future subdirectory drops in. Naming both is the version that
      # cannot silently start or stop covering something.
      #
      # Severity lives in .hadolint.yaml (failure-threshold: style —
      # every rule fails). The action always exports
      # HADOLINT_FAILURE_THRESHOLD=info, and the config file beats the
      # environment, so it is not restated here.
      - name: Oddjob image
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      # Runs even if the step above failed, so one push reports both
      # files rather than making you fix one to see the other.
      - name: Drone agent image
        if: '!cancelled()'
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: drone/Dockerfile
          config: .hadolint.yaml
