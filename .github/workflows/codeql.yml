name: CodeQL

# Static analysis over all three codebases. One job per language rather
# than one job with a matrix of paths: CodeQL builds an database per
# language, and a Go failure should not take the Python results with it.
#
# The three are genuinely separate programs that happen to share a
# repository — a Go agent that runs on someone else's network, a Python
# API that holds engagement data, and a React UI that renders captured
# attacker-controlled content. Each has a different thing worth finding.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, because a query pack updates and finds something in code
    # nobody has touched. Monday morning, before anyone is relying on it.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      # Writing the results back is the whole point; without this the
      # run succeeds and reports nothing.
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: drone (go)
            language: go
            path: drone
          - name: middleware (python)
            language: python
            path: backend
          - name: ui (javascript-typescript)
            language: javascript-typescript
            path: frontend

    steps:
      - uses: actions/checkout@v4

      # Go needs a real build for CodeQL to see across packages, and
      # the version has to match what the agent is actually built with.
      - uses: actions/setup-go@v5
        if: matrix.language == 'go'
        with:
          go-version: '1.26'
          cache-dependency-path: drone/go.sum

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # Only the directory this language lives in. Without it the
          # Python extractor also walks the UI's node_modules and the
          # JS extractor walks the backend's venv, which is slow and
          # produces findings in code nobody here wrote.
          source-root: ${{ matrix.path }}
          # security-and-quality over the default pack: this holds
          # credentials and captured traffic, and the extra queries are
          # worth the minutes.
          queries: security-and-quality

      # Autobuild handles Python and the UI. Go is built explicitly so
      # a build failure reads as a build failure rather than as CodeQL
      # quietly analysing nothing.
      - name: Build drone
        if: matrix.language == 'go'
        working-directory: drone
        run: go build ./...

      - uses: github/codeql-action/autobuild@v3
        if: matrix.language != 'go'

      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:${{ matrix.language }}
