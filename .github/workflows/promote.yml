# Promote a published image to a semver release. Manual, always.
#
# This RETAGS, it does not rebuild. `buildx imagetools create` copies
# the manifest list, so vX.Y.Z and the nightly it came from are the
# same bytes on every architecture — the thing that was running
# overnight is the thing that gets the version number. A rebuild at
# promotion time would produce a different image to the one anybody
# had actually exercised, which defeats the point of having nightlies.
#
# Versions live in git tags, not in Docker Hub tag listings. Hub tags
# get deleted, retention-pruned and hand-edited; a git tag is signed
# history and is also what somebody checks out to reproduce a release.
name: promote

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image'
        type: choice
        options: [both, oddjob, drone]
        default: both
      bump:
        description: 'Next version'
        type: choice
        options: [minor, major]
        default: minor
      from:
        # `nightly` rather than `develop`: a nightly has had a night of
        # being the thing people ran. `develop` is whatever landed
        # minutes ago, which is a fine thing to deploy and a poor thing
        # to put a version number on. Either is accepted, and so is a
        # `src-<key>` for promoting one exact source by hand.
        description: 'Tag to promote — nightly, develop, or src-<key>'
        type: string
        default: nightly

permissions:
  contents: write        # to push the git tag

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0     # tags, so the current version is knowable

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the next version
        id: v
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          # Highest existing vMAJOR.MINOR.PATCH, or v0.0.0 if this is
          # the first. `sort -V` so v0.10.0 beats v0.9.0, which a
          # lexical sort gets backwards.
          cur=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          cur=${cur:-v0.0.0}
          # Patch is read and discarded: a promotion always lands on .0.
          IFS=. read -r MA MI _ <<< "${cur#v}"
          case "$BUMP" in
            major) MA=$((MA+1)); MI=0 ;;
            minor) MI=$((MI+1)) ;;
            *) echo "unknown bump: $BUMP" >&2; exit 1 ;;
          esac
          # Patch is always 0 here. A promotion is a deliberate
          # minor/major; patches come from a fix branch, not from
          # pressing this button.
          next="v${MA}.${MI}.0"
          if git rev-parse "$next" >/dev/null 2>&1; then
            echo "::error::$next already exists — promote again for the one after, or delete it" >&2
            exit 1
          fi
          {
            echo "current=$cur"
            echo "next=$next"
            echo "bare=${next#v}"
          } >> "$GITHUB_OUTPUT"
          echo "Promoting $cur -> $next ($BUMP)"

      - name: Retag the images
        env:
          FROM: ${{ inputs.from }}
          WHICH: ${{ inputs.image }}
          NEXT: ${{ steps.v.outputs.bare }}
        run: |
          set -euo pipefail
          promote_one() {
            repo="cr0n1c/$1"
            # Fail loudly if there is nothing to promote, rather than
            # tagging thin air.
            if ! docker manifest inspect "$repo:$FROM" >/dev/null 2>&1; then
              echo "::error::$repo:$FROM does not exist — has the images workflow run?" >&2
              return 1
            fi
            digest=$(docker buildx imagetools inspect "$repo:$FROM" \
                      --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "  $repo:$FROM is $digest"
            # Same bytes, new names. Multi-arch manifest preserved.
            docker buildx imagetools create \
              --tag "$repo:v$NEXT" --tag "$repo:$NEXT" --tag "$repo:latest" \
              "$repo@$digest"
            echo "| \`$repo\` | \`v$NEXT\`, \`latest\` | \`${digest:0:19}…\` |" \
              >> "$GITHUB_STEP_SUMMARY"
          }
          {
            echo "### Promoted"
            echo "| image | tags | digest |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          # Spelled out rather than `[ ... ] && promote_one`: under
          # `set -e` that form exits the step when the test is false,
          # so promoting only `drone` would have silently skipped it.
          if [ "$WHICH" = "both" ] || [ "$WHICH" = "oddjob" ]; then
            promote_one oddjob
          fi
          if [ "$WHICH" = "both" ] || [ "$WHICH" = "drone" ]; then
            promote_one drone
          fi

      - name: Tag the commit
        env:
          NEXT: ${{ steps.v.outputs.next }}
          CUR: ${{ steps.v.outputs.current }}
          WHICH: ${{ inputs.image }}
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$NEXT" -m "$NEXT ($BUMP from $CUR) — promoted $WHICH from ${{ inputs.from }}"
          git push origin "$NEXT"
          {
            echo ""
            echo "Git tag \`$NEXT\` on \`$(git rev-parse --short HEAD)\`."
          } >> "$GITHUB_STEP_SUMMARY"
