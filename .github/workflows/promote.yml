# Promote a published image to a semver release. Manual, always.
#
# This RETAGS, it does not rebuild. `buildx imagetools create` copies
# the manifest list, so vX.Y.Z and the nightly it came from are the
# same bytes on every architecture — the thing that was running
# overnight is the thing that gets the version number. A rebuild at
# promotion time would produce a different image to the one anybody
# had actually exercised, which defeats the point of having nightlies.
#
# Versions live in git tags, not in Docker Hub tag listings. Hub tags
# get deleted, retention-pruned and hand-edited; a git tag is signed
# history and is also what somebody checks out to reproduce a release.
# Both are published — `cr0n1c/oddjob:v0.0.2` and `cr0n1c/ghost:v0.0.2`
# exist so a deployment can pin to a version — but the git tag is the
# record and the Hub tags are a convenience over it.
#
# ----------------------------------------- who decides the version
#
# Not this workflow. Read that twice, because it used to.
#
# This file used to take a `bump: minor|major` input, read the highest
# existing `v*.*.*` git tag, and compute the next one. That made it a
# second place the version was decided, alongside the `VERSION` file
# that the binaries, the images and the Health view all read. Two
# mechanisms that both claim the version will disagree, and the one
# people trust is whichever they looked at last.
#
# So the arithmetic moved out, into bump-version.yml, which does one
# thing: it edits `VERSION` on main. Everything downstream reads that
# file. The chain is:
#
#   bump-version.yml   writes VERSION = 0.0.2, commits to main
#        |             (the ONLY thing that decides a version)
#        v
#   images.yml         rebuilds — VERSION is part of the content key —
#        |             stamps 0.0.2 into the Go binaries and into the
#        |             org.opencontainers.image.version LABEL, and
#        |             publishes src-<key>, :develop / :nightly
#        v
#   promote.yml        reads the label off the digest it is promoting
#   (this file)        and makes THAT the release tag. It computes
#                      nothing. If the label says 0.0.2, the release
#                      is 0.0.2, in Docker Hub and in git alike.
#
# The label is read rather than the file at HEAD on purpose. A
# promotion is about a specific set of bytes, and `VERSION` at the tip
# of main may have moved on since those bytes were built. The version
# of an image is a property of the image. Where the two differ this
# workflow says so in its summary and carries on — promoting an older
# nightly is a legitimate thing to do, and it should publish the number
# that image was built with, not today's.
#
# -------------------------------------------------- what is checked
#
# Before anything is tagged:
#
#   * the label exists, and both images agree on it when promoting
#     both. One number for one release.
#   * it is a bare semver triple with no `-dev-` suffix
#     (scripts/check-version.sh, the same script ci.yml and the
#     pre-commit hook run). A dev build must never become a Docker Hub
#     tag any more than it may reach main.
#   * `src-<key>` resolves to the same digest as the tag being
#     promoted. This is what keeps the version tag coherent with
#     images.yml: `v0.0.2` is provably the same bytes as the
#     `src-<key>` they were published under, and anyone can check it
#     afterwards with the two commands printed in the summary.
#   * the git tag does not already exist.
#
# `latest` only moves forward. Promoting an older image — which is
# allowed, and is what you do to re-release bytes after a bad
# promotion — must not drag `latest` backwards for everyone pulling it.
name: promote

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Which image'
        type: choice
        options: [both, oddjob, ghost]
        default: both
      from:
        # `nightly` rather than `develop`: a nightly has had a night of
        # being the thing people ran. `develop` is whatever landed
        # minutes ago, which is a fine thing to deploy and a poor thing
        # to put a version number on. Either is accepted, and so is a
        # `src-<key>` for promoting one exact source by hand.
        description: 'Tag to promote — nightly, develop, or src-<key>'
        type: string
        default: nightly
      expect:
        # Optional, and the only way an operator states a version at
        # all. Not a choice of version — a statement of what they
        # believe they are releasing, checked against what the image
        # says. Leave it blank to accept whatever the image carries.
        description: 'Optional: the version you expect, e.g. 0.0.2. Blank to accept the image''s own.'
        type: string
        default: ''

permissions:
  contents: write        # to push the git tag

concurrency:
  group: promote
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0     # tags, so an existing release is knowable

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v3
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Read the version off the images being promoted
        id: v
        env:
          FROM: ${{ inputs.from }}
          WHICH: ${{ inputs.image }}
          EXPECT: ${{ inputs.expect }}
        run: |
          set -euo pipefail

          # Spelled out rather than `[ ... ] && images+=(...)`: under
          # `set -e` that form exits the step when the test is false,
          # so selecting only `ghost` would have silently selected
          # nothing. This is the same bug the old retag step carried a
          # comment about; it is repeated here because the shape is
          # just as tempting the second time.
          images=()
          if [ "$WHICH" = "both" ] || [ "$WHICH" = "oddjob" ]; then
            images+=(oddjob)
          fi
          if [ "$WHICH" = "both" ] || [ "$WHICH" = "ghost" ]; then
            images+=(ghost)
          fi
          if [ ${#images[@]} -eq 0 ]; then
            echo "::error::no image selected" >&2; exit 1
          fi

          # One label value per image, read from the image config
          # rather than from anywhere in this repository. `.Image` is
          # the config for a single-platform image and a map of them
          # for a manifest list, which is why the jq normalises both
          # into a list. Every platform must agree: a manifest whose
          # two halves were built from different VERSIONs is a broken
          # publish, and silently taking the first one would hide it.
          label_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Image}}' \
              | jq -r '(if has("config") then [.] else [.[]] end)
                       | map(.config.Labels["'"$2"'"] // "") | unique | .[]'
          }

          version=""
          for img in "${images[@]}"; do
            repo="docker.io/cr0n1c/$img"
            ref="$repo:$FROM"
            if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::$ref does not exist — has the images workflow run?" >&2
              exit 1
            fi

            v=$(label_of "$ref" org.opencontainers.image.version)
            if [ -z "$v" ]; then
              echo "::error::$ref carries no org.opencontainers.image.version label." >&2
              echo "::error::It predates version pinning. Re-run the images workflow" >&2
              echo "::error::(workflow_dispatch, force) and promote the result." >&2
              exit 1
            fi
            if [ "$(printf '%s\n' "$v" | wc -l | tr -d '[:space:]')" -ne 1 ]; then
              echo "::error::$ref reports more than one version across platforms:" >&2
              printf '  %s\n' $v >&2
              exit 1
            fi
            if [ -n "$version" ] && [ "$version" != "$v" ]; then
              echo "::error::the selected images disagree: $version vs $v." >&2
              echo "::error::Promote them separately, or rebuild so they match." >&2
              exit 1
            fi
            version="$v"

            # Coherence with images.yml. `src-<key>` is the durable
            # name for exactly these bytes; if it does not resolve to
            # the same digest then the moving tag has been hand-edited
            # and `v$version` would be a name for something nobody can
            # trace back.
            key=$(label_of "$ref" ai.xsecurity.source-key)
            digest=$(docker buildx imagetools inspect "$ref" \
                      --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ -n "$key" ] && [ "$(printf '%s\n' "$key" | wc -l | tr -d '[:space:]')" -eq 1 ]; then
              srcd=$(docker buildx imagetools inspect "$repo:src-$key" \
                      --format '{{json .Manifest.Digest}}' | tr -d '"' || true)
              if [ "$srcd" != "$digest" ]; then
                echo "::error::$ref is $digest but $repo:src-$key is ${srcd:-missing}." >&2
                echo "::error::The moving tag and its source tag have come apart." >&2
                exit 1
              fi
              echo "$img: $FROM == src-$key == $digest"
              echo "${img}_key=$key" >> "$GITHUB_OUTPUT"
            fi
            echo "${img}_digest=$digest" >> "$GITHUB_OUTPUT"
            echo "${img}_revision=$(label_of "$ref" org.opencontainers.image.revision | head -1)" \
              >> "$GITHUB_OUTPUT"
          done

          # A bare triple, and no `-dev-`. The same script the CI
          # version job and the pre-commit hook run, so a dev build
          # cannot become a Hub tag by a route that skipped the one
          # place the rule is written down.
          scripts/check-version.sh "$version"

          if [ -n "$EXPECT" ] && [ "$EXPECT" != "$version" ]; then
            echo "::error::you asked for $EXPECT and the image says $version." >&2
            echo "::error::Nothing was tagged. Either the wrong tag is being" >&2
            echo "::error::promoted, or VERSION was bumped after it was built." >&2
            exit 1
          fi

          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "::error::git tag v$version already exists." >&2
            echo "::error::That version has been released. Bump VERSION on main" >&2
            echo "::error::(bump-version.yml), let images.yml rebuild, then promote." >&2
            exit 1
          fi

          # `latest` moves only forward. `sort -V` so v0.10.0 beats
          # v0.9.0, which a lexical sort gets backwards.
          highest=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' | sort -V | tail -1)
          highest=${highest:-v0.0.0}
          newest=$(printf '%s\nv%s\n' "$highest" "$version" | sort -V | tail -1)
          if [ "$newest" = "v$version" ]; then
            move_latest=true
          else
            move_latest=false
          fi

          # Not an error. The file having moved on is the normal state
          # when a bump landed after the nightly being promoted was
          # built, and the image's own number is still the right one to
          # publish. Said out loud so nobody has to wonder.
          head_version=$(scripts/version.sh --release)
          {
            echo "version=$version"
            echo "images=${images[*]}"
            echo "move_latest=$move_latest"
            echo "head_version=$head_version"
          } >> "$GITHUB_OUTPUT"
          echo "promoting $FROM as $version (VERSION on main is $head_version)"

      - name: Retag the images
        env:
          FROM: ${{ inputs.from }}
          IMAGES: ${{ steps.v.outputs.images }}
          VER: ${{ steps.v.outputs.version }}
          MOVE_LATEST: ${{ steps.v.outputs.move_latest }}
        run: |
          set -euo pipefail
          {
            echo "### Promoted \`$VER\`"
            echo "| image | tags | digest | source |"
            echo "|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for img in $IMAGES; do
            repo="cr0n1c/$img"
            # By digest, never by name. Resolving the name a second
            # time could pick up a different image if the pointer moved
            # between the check above and this step, and the whole
            # promise of this workflow is that the released bytes are
            # the bytes that were inspected.
            digest=$(docker buildx imagetools inspect "$repo:$FROM" \
                      --format '{{json .Manifest.Digest}}' | tr -d '"')
            tags=(--tag "$repo:v$VER" --tag "$repo:$VER")
            names="\`v$VER\`, \`$VER\`"
            if [ "$MOVE_LATEST" = "true" ]; then
              tags+=(--tag "$repo:latest")
              names="$names, \`latest\`"
            fi
            # Same bytes, new names. Multi-arch manifest preserved.
            docker buildx imagetools create "${tags[@]}" "$repo@$digest"
            echo "| \`$repo\` | $names | \`${digest:0:19}…\` | \`$FROM\` |" \
              >> "$GITHUB_STEP_SUMMARY"
          done

          if [ "$MOVE_LATEST" != "true" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`latest\` was **not** moved: \`$VER\` is not the highest release." \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Tag the commit
        env:
          VER: ${{ steps.v.outputs.version }}
          IMAGES: ${{ steps.v.outputs.images }}
          FROM: ${{ inputs.from }}
          HEAD_VERSION: ${{ steps.v.outputs.head_version }}
          ODDJOB_REVISION: ${{ steps.v.outputs.oddjob_revision }}
          GHOST_REVISION: ${{ steps.v.outputs.ghost_revision }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The commit the image was BUILT from, out of the
          # org.opencontainers.image.revision label — not HEAD. "Check
          # out v0.0.2 to reproduce the release" is only true if the
          # tag is on the commit whose tree produced those bytes, and
          # main has usually moved on by the time anybody promotes.
          rev="${ODDJOB_REVISION:-$GHOST_REVISION}"
          if [ -z "$rev" ] || ! git cat-file -e "$rev^{commit}" 2>/dev/null; then
            echo "::warning::no usable revision label (${rev:-none}); tagging HEAD instead"
            rev=$(git rev-parse HEAD)
          fi

          git tag -a "v$VER" "$rev" \
            -m "v$VER — promoted $IMAGES from $FROM" \
            -m "Version from the image's org.opencontainers.image.version label." \
            -m "VERSION on main at promotion time: $HEAD_VERSION"
          git push origin "v$VER"
          {
            echo ""
            echo "Git tag \`v$VER\` on \`$(git rev-parse --short "$rev")\`."
            echo ""
            echo "To verify the release tag is the same bytes as the source tag"
            echo "it was promoted from:"
            echo ""
            echo '```'
            for img in $IMAGES; do
              echo "docker buildx imagetools inspect cr0n1c/$img:v$VER \\"
              echo "  --format '{{json .Manifest.Digest}}'"
              echo "docker buildx imagetools inspect cr0n1c/$img:$FROM \\"
              echo "  --format '{{json .Manifest.Digest}}'"
            done
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
