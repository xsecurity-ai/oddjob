# Dependency updates.
#
# Grouped, because this repository has three ecosystems and ungrouped
# updates produce a dozen pull requests a week that nobody reads — which
# is worse than none, since the security ones get lost among them.
#
# Security updates are NOT grouped: they arrive separately and
# immediately, whatever the schedule below says.
version: 2

updates:
  - package-ecosystem: uv
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    # Hold a new release for a week before offering it. The window
    # a malicious publish is live before it is caught and yanked is
    # usually hours; opening the PR immediately is how it gets
    # merged inside that window. Security advisories are exempt and
    # still arrive at once.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, backend]
    commit-message:
      prefix: "deps(backend)"

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    # Hold a new release for a week before offering it. The window
    # a malicious publish is live before it is caught and yanked is
    # usually hours; opening the PR immediately is how it gets
    # merged inside that window. Security advisories are exempt and
    # still arrive at once.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      # MUI first: a dependency goes to the FIRST group it matches, and
      # the catch-all below would otherwise claim it. Its packages ship
      # in lockstep, and splitting them across pull requests produces a
      # build that cannot resolve peer versions — which is exactly what
      # happened on the first run, with @mui/material and
      # @mui/x-data-grid arriving as separate majors.
      mui:
        patterns: ["@mui/*"]
        update-types: [major, minor, patch]
      # Vite and its React plugin have to move together too; the plugin
      # pins a vite peer range.
      vite:
        patterns: ["vite", "@vitejs/*"]
        update-types: [major, minor, patch]
      frontend-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, frontend]
    commit-message:
      prefix: "deps(frontend)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Hold a new release for a week before offering it. The window
    # a malicious publish is live before it is caught and yanked is
    # usually hours; opening the PR immediately is how it gets
    # merged inside that window. Security advisories are exempt and
    # still arrive at once.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
    labels: [dependencies, ci]
    commit-message:
      prefix: "deps(ci)"

  # The agent's Go module. It was missing entirely — the one component
  # that runs on someone else's network had no dependency updates at
  # all, which is the opposite of the order you would choose.
  - package-ecosystem: gomod
    directory: /ghost
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      ghost-minor-and-patch:
        update-types: [minor, patch]
    labels: [dependencies, ghost]
    commit-message:
      prefix: "deps(ghost)"
