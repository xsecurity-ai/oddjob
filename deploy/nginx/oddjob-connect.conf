# TLS for the ghost proxy, terminated by nginx.
#
#   stream { include /etc/nginx/conf.d/oddjob-connect.conf; }
#
# This is a `stream` block, NOT an http one. It goes inside the
# top-level `stream { }` context, beside `http { }` -- not in
# conf.d if your conf.d is included from http.
#
# ---------------------------------------------------------- why here
#
# Oddjob can terminate TLS itself (`proxy.tls_cert`), and for a
# deployment with no reverse proxy it should. Where nginx already
# exists, this is better for three reasons that have nothing to do
# with performance:
#
#   * The certificate is already here and already renewing. Mounting
#     it into the application container adds a second copy, a second
#     thing to rotate, and a restart to pick up each renewal.
#   * A certificate the application never sees is one it cannot
#     mishandle.
#   * A self-signed certificate is not a real alternative for a
#     PROXY. A browser offers no click-through for a proxy
#     certificate the way it does for a page -- the connection just
#     fails -- so it would have to be imported into every browser's
#     trust store. The certificate nginx already holds is trusted
#     everywhere.
#
# What nginx CANNOT do is be the proxy. It has no CONNECT support,
# and the authorisation that matters -- the per-ghost grant, the
# scope gate, the audit row, the tunnel to the right agent -- all
# live in Oddjob and must not be duplicated. So nginx does the one
# part it is good at and hands over a decrypted stream.
#
# ------------------------------------------------------- what is open
#
# This publishes a port that reaches a route INTO a client's
# network. It is guarded by a per-ghost credential, the scope gate
# and an audit row on every connection, accepted or refused -- but
# there is no rate limiting and no lockout in front of it. An
# allowlist is cheap insurance and is commented in below.

upstream oddjob_proxy {
    # The application's demuxing port. It sees a plain `CONNECT`
    # here because nginx has already removed the TLS, and routes on
    # the first byte accordingly.
    server 127.0.0.1:8443;
}

server {
    listen 8443 ssl;
    listen [::]:8443 ssl;

    ssl_certificate     /etc/nginx/certs/helms.world.crt;
    ssl_certificate_key /etc/nginx/certs/helms.world.key;

    # 1.2 floor. A proxy credential crosses this connection, and
    # the entire reason it exists is that the SOCKS listener beside
    # it has no transport security at all.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:ODDJOB_PROXY:4m;
    ssl_session_timeout 1h;

    # Who may even reach it. Uncomment and narrow to the addresses
    # your testers come from: everything below this line is Oddjob's
    # job, and everything above it is one fewer thing Oddjob has to
    # be right about.
    #
    # allow 203.0.113.0/24;
    # deny all;

    # A browser holds a proxy connection open across a whole
    # session, and a tester reading a slow admin page is not an
    # idle connection. Long, deliberately.
    proxy_timeout 1h;
    proxy_connect_timeout 10s;

    proxy_pass oddjob_proxy;
}
