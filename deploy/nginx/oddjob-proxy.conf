# Shared proxy settings. Installed as
# /etc/nginx/snippets/oddjob-proxy.conf.
#
# One file so the four locations in oddjob.conf cannot drift apart —
# the one that gets forgotten is always the one where it matters.

proxy_pass http://127.0.0.1:8000;
proxy_http_version 1.1;

# $host, not $http_host: the app builds magic-link URLs and redirects
# from what it is told it is, and getting this wrong sends somebody a
# sign-in link pointing at 127.0.0.1.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
# The audit log reads the LEFTMOST entry of this. nginx appending to
# whatever the client sent means a caller can put anything in front of
# their own address, so for an internet-facing deployment set it to
# $remote_addr instead and the log records what nginx observed rather
# than what the caller claimed:
#
#   proxy_set_header X-Forwarded-For $remote_addr;
#
# Left as the conventional append here because that is correct when
# this sits behind another trusted proxy (Cloudflare, a load
# balancer). Pick one deliberately; the default is wrong for exactly
# one of the two.
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
# Passed for completeness, but it is NOT what decides the Secure flag
# on the session cookie: that comes from `site.base_url` in Site
# Config. Setting it to https://your-host is a required deployment
# step, not a cosmetic one — leave it http:// behind TLS and the
# session cookie ships without Secure, and HSTS is never sent.
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;

# For the SSE stream and anything else long-lived.
proxy_set_header Connection        "";
proxy_set_header Upgrade           $http_upgrade;

proxy_connect_timeout 10s;
proxy_send_timeout    300s;
# proxy_read_timeout is deliberately NOT here: it differs per location
# (24h for the event stream, 1h for a drone's result upload, 300s for
# the UI) and nginx treats a second one in the same context as a
# configuration error rather than an override.

# Do not rewrite the app's own redirects: it already emits paths
# relative to the host it was told it is serving.
proxy_redirect off;
