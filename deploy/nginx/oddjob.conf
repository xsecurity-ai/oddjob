# Oddjob behind nginx, on a host that is reachable from the internet.
#
# Oddjob has no rate limiting, no brute-force lockout and no WAF of its
# own — see SECURITY.md, which says so and says to put this in front of
# it. It holds findings, credentials and captured traffic including
# session cookies, so the login form is the only thing between a
# stranger and a client's estate. The limits below are not decoration;
# without them, exposing this is a credential-stuffing target.
#
#   cp deploy/nginx/oddjob.conf /etc/nginx/sites-available/oddjob
#   ln -s /etc/nginx/sites-available/oddjob /etc/nginx/sites-enabled/
#   certbot --nginx -d oddjob.example.com     # or point ssl_* at your own
#   nginx -t && systemctl reload nginx
#
# Replace oddjob.example.com throughout. The upstream assumes the
# compose stack on the same host with its default loopback bind.

# Two zones, because the two problems are different sizes.
#
# `oddjob_login` is the one that matters: guessing a password is a
# volume attack, and six attempts a minute makes it useless while
# staying invisible to somebody who typed their own password wrong.
# 10m holds roughly 160,000 addresses.
limit_req_zone $binary_remote_addr zone=oddjob_login:10m rate=6r/m;
# Everything else, generous enough that a busy import or a crawl of the
# UI never notices, tight enough to bound a scraper.
limit_req_zone $binary_remote_addr zone=oddjob_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=oddjob_conn:10m;

server {
    listen 80;
    listen [::]:80;
    server_name oddjob.example.com;
    # Certbot writes its challenge here; everything else goes to TLS.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name oddjob.example.com;

    ssl_certificate     /etc/letsencrypt/live/oddjob.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddjob.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:oddjob_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # HSTS only, and deliberately only HSTS.
    #
    # The app already sets X-Frame-Options, Referrer-Policy and
    # X-Content-Type-Options, computes them from `site.base_url`, and
    # exposes them in Site Config. Adding them here too emits each one
    # TWICE — and nginx's copies were the weaker pair (SAMEORIGIN
    # against the app's DENY, same-origin against its no-referrer),
    # which is an ambiguity on every response and a downgrade on any
    # client that honours the last one it sees. The app owns them.
    #
    # HSTS stays because of the responses the app never sees: a 429
    # from the rate limiter above, or a 502 while the container
    # restarts, are generated by nginx, and `always` is what puts the
    # header on those too.
    # proxy_hide_header first: once site.base_url is https the app
    # sends its own HSTS, and simply adding one here emits the header
    # TWICE with different max-ages. Found in production, not in
    # review — it only appears after the base_url step, which is the
    # step that comes last.
    proxy_hide_header Strict-Transport-Security;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # nginx's version in the Server header tells a scanner which CVEs
    # to try. Costs nothing to withhold.
    server_tokens off;

    # Imports are the big bodies here: an nmap XML or a Burp export
    # from a real engagement is routinely tens of megabytes, and the
    # default 1m rejects them with a 413 that reads like a bug.
    client_max_body_size 512m;
    client_body_timeout 300s;

    # One client should not be able to hold every worker open.
    limit_conn oddjob_conn 48;

    access_log /var/log/nginx/oddjob.access.log;
    error_log  /var/log/nginx/oddjob.error.log;

    # ---------------------------------------------------------------
    # Sign-in. Everything that can be used to guess or mint a session.
    # ---------------------------------------------------------------
    location ~ ^/api/auth/(login|setup|magic-link|google/start)$ {
        proxy_read_timeout 60s;
        limit_req zone=oddjob_login burst=4 nodelay;
        # 429, not 503: the client is being told to slow down, and a
        # 503 reads as "the server is broken" to both humans and
        # monitoring.
        limit_req_status 429;
        include /etc/nginx/snippets/oddjob-proxy.conf;
    }

    # ---------------------------------------------------------------
    # The live event stream. Buffering here is what makes the UI look
    # broken: events arrive late and in bursts instead of as they
    # happen. The app already sends X-Accel-Buffering: no, and this
    # says the same thing in case that header is ever dropped.
    # ---------------------------------------------------------------
    location = /api/events {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
        include /etc/nginx/snippets/oddjob-proxy.conf;
    }

    # ---------------------------------------------------------------
    # Drones. Deliberately NOT rate limited with the login zone: a
    # fleet heartbeats every few seconds and submits results in bursts
    # after a long scan, and throttling that drops findings from work
    # that already ran against someone's estate. They authenticate
    # with a signed agent key, not a password, so they are not the
    # brute-force surface.
    # ---------------------------------------------------------------
    location /api/agents/ {
        proxy_read_timeout 1h;      # a big result POST
        client_max_body_size 1g;    # masscan output from a /16
        include /etc/nginx/snippets/oddjob-proxy.conf;
    }

    location / {
        proxy_read_timeout 300s;
        limit_req zone=oddjob_api burst=60 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/oddjob-proxy.conf;
    }
}
