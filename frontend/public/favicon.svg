<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64"
     role="img" aria-label="Oddjob">
  <title>Oddjob</title>
  <!--
    A bowler hat. The proportions are the whole design: a LOW domed crown
    sitting directly on a brim only ~1.7x its width. Push the crown taller
    or the brim wider and the silhouette stops being a hat and becomes a
    flying saucer, which is exactly what the first draft did.

    Geometry is kept identical to scripts/favicon.py, which renders the
    .ico and .png fallbacks, so the vector and the bitmaps agree.
  -->
  <defs>
    <!-- Crown outline, reused to clip the shading and the hatband so
         neither can spill past the silhouette. -->
    <clipPath id="crown">
      <path d="M15.62 44.6 V29.48 a16.38 16.38 0 0 1 32.76 0 V44.6 Z"/>
    </clipPath>
  </defs>

  <!-- Brim underside, offset down: gives the brim thickness. -->
  <ellipse cx="32" cy="47.12" rx="27.72" ry="7.56" fill="#c64aaa"/>

  <g clip-path="url(#crown)">
    <path d="M15.62 44.6 V29.48 a16.38 16.38 0 0 1 32.76 0 V44.6 Z" fill="#ff7edb"/>
    <!-- Right third in shadow; a flat pink blob reads as a dome only
         once something tells the eye which way it curves. -->
    <rect x="37.04" y="8" width="14" height="40" fill="#c64aaa"/>
    <!-- Highlight on the left shoulder. -->
    <path d="M16.93 25.86 A12.6 12.6 0 0 1 28.38 14.41"
          fill="none" stroke="#ffc4f0" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Hatband. Sits on the crown, above the brim line — this is the
         detail that says "bowler" rather than "mound". -->
    <rect x="14" y="33.26" width="36" height="6.3" fill="#5eeaf0"/>
    <rect x="14" y="37.04" width="36" height="2.52" fill="#3cb4be"/>
  </g>

  <!-- Brim last, so its front edge passes in front of the crown and
       interlocks with the band. -->
  <ellipse cx="32" cy="44.6" rx="27.72" ry="7.56" fill="#ff7edb"/>
  <path d="M5.95 42.01 A27.72 7.56 0 0 1 58.05 42.01"
        fill="none" stroke="#ffc4f0" stroke-width="2" stroke-linecap="round"/>
</svg>
