# Oddjob and its database.
#
#   cp .env.example .env     # then edit the two passwords
#   docker compose up -d
#   open http://127.0.0.1:8000
#
# The first page asks you to create the admin account. Everything after
# that needs a session.

name: oddjob

services:
  db:
    # Pinned by digest, and the pin matters more here than anywhere
    # else in this file. Postgres will not start against a data
    # directory written by a different major version — it exits with
    # "database files are incompatible with server" and stays down —
    # and Chainguard's free tier publishes only the mutable `latest`.
    # A digest is therefore the only way to know which major you are
    # about to run.
    #
    # THIS IS POSTGRES 18. A deployment whose pgdata was written by 17
    # must be migrated before it will start: deploy/pg17-to-18.sh.
    #
    # When a Dependabot PR moves this digest, check the major before
    # merging it. Every other digest bump in this repository is safe
    # to take on faith; this one can stop the database.
    #   docker run --rm --entrypoint /usr/bin/postgres IMAGE --version
    image: cgr.dev/chainguard/postgres:latest@sha256:0c4eaf6cb9bd65337d834f5ebfe79add4312ee2125ab584bf1fbc071abc6bb8f
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oddjob}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-oddjob}
    # Postgres ships defaults sized for a machine that might have
    # 256 MB of RAM, and leaves them there for ever. On the reference
    # deployment that meant `shared_buffers=128MB` against an 8.9 GB
    # database: a 20.8% cache hit ratio, 678 TB read from disk, and a
    # container holding 250 MB of the 30 GB available to it.
    #
    # Overridable per deployment, because the right numbers depend on
    # the box. The ratios are the usual ones: about a quarter of the
    # RAM you are willing to give Postgres in `shared_buffers`, and
    # roughly three quarters of it in `effective_cache_size` -- which
    # is a HINT about the OS page cache, not an allocation.
    #
    # `work_mem` is per sort NODE per connection, not per query, so a
    # big value times a deep plan times the pool is a real number.
    #
    # `shm_size` is not tuning, it is a bug fix: Docker gives a
    # container 64 MB of /dev/shm, and a parallel sequential scan --
    # which this schema uses, see the CVE queries -- fails with
    # "could not resize shared memory segment" when it needs more.
    #
    # **An override file that sets `command:` REPLACES this list, it
    # does not merge with it.** Compose replaces sequences wholesale,
    # so a `docker-compose.override.yaml` adding
    # `shared_preload_libraries=pg_stat_statements` has to repeat
    # every line below or it silently un-tunes the database -- which
    # is how the reference deployment ended up back on the defaults.
    shm_size: ${POSTGRES_SHM:-1gb}
    command:
      - "-c"
      - "shared_buffers=${POSTGRES_SHARED_BUFFERS:-1GB}"
      - "-c"
      - "effective_cache_size=${POSTGRES_EFFECTIVE_CACHE:-3GB}"
      - "-c"
      - "work_mem=${POSTGRES_WORK_MEM:-16MB}"
      - "-c"
      - "maintenance_work_mem=${POSTGRES_MAINTENANCE_WORK_MEM:-256MB}"
      # Postgres' default of 4 assumes a spinning disk, where a random
      # read costs four seeks' worth of a sequential one. On SSD or
      # NVMe that ratio is roughly 1, and leaving it at 4 tells the
      # planner an index scan is four times dearer than it is -- so it
      # picks sequential scans over indexes that exist and would win.
      # Measured on the reference box (NVMe): a filtered count went
      # 14.0ms -> 2.9ms and an ordered page 1.12ms -> 0.11ms.
      # Raise it back towards 4 if you really are on spinning rust.
      - "-c"
      - "random_page_cost=${POSTGRES_RANDOM_PAGE_COST:-1.1}"
      # 75% of the reference database is TOAST -- scanner output and
      # captured HTTP bodies -- so the compression codec is not a
      # detail. lz4 is substantially faster to compress AND
      # decompress than the default pglz at a similar ratio. It
      # applies to newly written data; existing pglz values stay
      # readable, the two coexist, and nothing needs rewriting.
      - "-c"
      - "default_toast_compression=${POSTGRES_TOAST_COMPRESSION:-lz4}"
      # A bulk import or a CVE sync writes hundreds of thousands of
      # rows. At the 1 GB default these force a checkpoint every few
      # seconds, and every checkpoint makes the next write of each
      # page a FULL PAGE write into the WAL.
      - "-c"
      - "max_wal_size=${POSTGRES_MAX_WAL_SIZE:-4GB}"
      - "-c"
      - "wal_compression=${POSTGRES_WAL_COMPRESSION:-lz4}"
      # The defaults wait for 20% of a table to be dead before
      # vacuuming it. On a 200,000-row table that is 40,000 dead rows
      # -- and the reference box sat at 12-16% dead across its
      # largest tables, which is exactly what 20% looks like in
      # practice.
      - "-c"
      - "autovacuum_vacuum_scale_factor=${POSTGRES_AUTOVACUUM_SCALE:-0.05}"
      - "-c"
      - "autovacuum_analyze_scale_factor=${POSTGRES_AUTOANALYZE_SCALE:-0.02}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Bound to loopback, not published to the network. This database
    # holds findings, credentials and captured traffic; it has no
    # business being reachable from off the host. Comment the whole
    # block out if you do not need a psql client on the host at all.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oddjob} -d ${POSTGRES_DB:-oddjob}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    # Stock image, stock settings. If a large import crawls, the knobs
    # worth turning first are shared_buffers, work_mem and
    # synchronous_commit — add them as `command: [postgres, -c, ...]`.

  app:
    # Named so the build is reusable rather than anonymous. Two things
    # this buys: `docker compose up` finds an image already built by
    # `docker buildx build -t` and starts it instead of rebuilding
    # with the legacy builder, which has no layer cache; and setting
    # ODDJOB_IMAGE to a published tag runs that instead of building at
    # all — `ODDJOB_IMAGE=cr0n1cx/oddjob:v1.2.0 docker compose up -d`.
    image: ${ODDJOB_IMAGE:-oddjob:local}
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # The image is distroless: no shell, no package manager, no
    # coreutils. Worth knowing before you need to debug it, because
    # the usual reflexes do not work here —
    #
    #   docker compose exec app sh              no shell to exec
    #   docker compose exec app curl ...        no curl
    #   docker compose exec app python -c ...   WORKS
    #
    # and the one interpreter that is present is the venv's:
    #
    #   docker compose exec app /opt/venv/bin/python -c 'import os;print(os.getuid())'
    #   docker compose exec app alembic current
    #
    # To get a shell against the same filesystem, run a debug
    # container sharing the volume rather than trying to find one in
    # this image:
    #
    #   docker run --rm -it -v oddjob_secret:/data alpine sh
    depends_on:
      db:
        condition: service_healthy
    environment:
      ODDJOB_DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-oddjob}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oddjob}
      # Leave unset to have one generated into the `secret` volume on
      # first boot. Set it to share one key across replicas.
      ODDJOB_SECRET: ${ODDJOB_SECRET:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    volumes:
      # The session-signing key, so a restart does not log everyone out.
      #
      # Written and read as uid 10001, which is why the image keeps
      # that uid rather than taking the distroless default of 65532 —
      # the files in this volume on an existing deployment are owned
      # by 10001, and a container running as anything else cannot
      # write here. If you ever do change the uid, the volume has to
      # be chowned to match in the same step:
      #
      #   docker run --rm -v oddjob_secret:/d alpine chown -R NEW:NEW /d
      - secret:/app/backend/data
      # The GeoLite2 databases. Without this they live in the
      # container's writable layer, so every deploy throws them away
      # and the Country column goes blank until someone notices and
      # downloads them again — and "blank" here reads as "we have not
      # looked yet", which is true but not for the reason it implies.
      # Watchtower redeploys on every push, so that is often.
      - geoip:/var/lib/oddjob/geoip
    # Loopback by default. There is no rate limiting, no brute-force
    # lockout and no WAF in front of this; put it behind a VPN or a
    # reverse proxy that does authentication before you change the bind
    # address. See SECURITY.md.
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8000}:8000"
      # The ghost proxy, when `proxy.enabled` is on. Published
      # because it was NOT, and the feature therefore could not
      # work at all: the listener bound inside the container, the
      # port was not mapped, and `ssh -L 8443:127.0.0.1:8443` on
      # the host forwarded to nothing. An `ssh -L` succeeds whether
      # or not anything listens on the far side, so the tunnel
      # coming up proved nothing and the gap went unnoticed.
      #
      # Loopback by default, like the app above. On that address it
      # is reachable through an SSH tunnel and from nowhere else,
      # which is the right default for a route into a client's
      # network. Set PROXY_BIND_ADDRESS to publish it, and read
      # `proxy.tls_cert` first: without a certificate this port is
      # SOCKS5, whose credential is plaintext on the wire.
      - "${PROXY_BIND_ADDRESS:-127.0.0.1}:${PROXY_PORT:-8443}:8443"
      # The TLS proxy port: CONNECT inside TLS, so a browser can
      # be pointed at this host without an SSH tunnel. Listens
      # only when proxy.tls_cert is set.
      #
      # 0.0.0.0 here IS the point -- reaching it from a browser
      # is what it exists for, and the credential travels inside
      # TLS. Every connection still needs a per-ghost grant,
      # passes the scope gate and is recorded. There is no rate
      # limiting in front of it, so an IP allowlist is cheap
      # insurance.
      #
      # CHECK THE HOST PORT IS FREE before publishing it. On a
      # shared host 8444 was already held by another service's
      # rootless-networking helper, and the container then would
      # not start at all -- which takes Oddjob down, not just
      # the proxy. `ss -ltn | grep 8444` first.
      - "${PROXY_TLS_BIND_ADDRESS:-0.0.0.0}:${PROXY_TLS_PORT:-8444}:8444"

volumes:
  pgdata:
  secret:
  geoip:
